<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="50%" stop-color="#2d1f0e"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <linearGradient id="floorBanner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a67c1a"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#ffca28"/>
    </linearGradient>
    <filter id="bannerShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="470" fill="url(#bannerBg)"/>

  <!-- Kitchen wall -->
  <rect x="0" y="0" width="800" height="280" fill="#c4a574" opacity="0.15"/>
  <rect x="0" y="270" width="800" height="12" fill="#8b7355" opacity="0.4"/>

  <!-- Floor -->
  <rect x="0" y="282" width="800" height="188" fill="url(#floorBanner)"/>
  <g opacity="0.35" stroke="#6d4c12" stroke-width="1">
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="160" y1="282" x2="160" y2="470"/>
    <line x1="320" y1="282" x2="320" y2="470"/>
    <line x1="480" y1="282" x2="480" y2="470"/>
    <line x1="640" y1="282" x2="640" y2="470"/>
  </g>

  <!-- Decorative nest (cardboard box) -->
  <g transform="translate(620, 310)" opacity="0.7">
    <polygon points="0,0 80,0 90,20 10,20" fill="#d4a574"/>
    <rect x="10" y="20" width="80" height="50" fill="#bcaaa4"/>
    <rect x="25" y="35" width="20" height="15" fill="#ffa726" opacity="0.3" rx="2"/>
  </g>

  <!-- Crumbs -->
  <circle cx="100" cy="400" r="5" fill="#ffca28" opacity="0.6"/>
  <circle cx="700" cy="430" r="4" fill="#ffca28" opacity="0.5"/>
  <ellipse cx="550" cy="380" rx="7" ry="4" fill="#ffca28" opacity="0.4"/>

  <!-- Cockroach hero -->
  <g filter="url(#bannerShadow)" transform="translate(580, 340) scale(1.3)">
    <ellipse cx="0" cy="55" rx="55" ry="14" fill="#000" opacity="0.3"/>
    <path d="M -15 -40 Q -28 -70 -40 -82" stroke="#6d4c3d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 15 -40 Q 28 -70 40 -82" stroke="#6d4c3d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <g stroke="#3e2723" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M -25 8 L -52 28"/><path d="M -16 16 L -46 46"/><path d="M -8 22 L -36 58"/>
      <path d="M 25 8 L 52 28"/><path d="M 16 16 L 46 46"/><path d="M 8 22 L 36 58"/>
    </g>
    <ellipse cx="0" cy="20" rx="34" ry="26" fill="#4a3728"/>
    <ellipse cx="0" cy="-8" rx="22" ry="18" fill="#4a3728"/>
    <ellipse cx="0" cy="-32" rx="16" ry="13" fill="#4a3728"/>
    <circle cx="-6" cy="-35" r="4" fill="#1a1208"/>
    <circle cx="6" cy="-35" r="4" fill="#1a1208"/>
    <circle cx="-5" cy="-36" r="1.5" fill="#ffa726"/>
    <circle cx="7" cy="-36" r="1.5" fill="#ffa726"/>
  </g>

  <!-- Title block -->
  <g transform="translate(60, 80)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#bcaaa4" opacity="0.9">COCKROACH LIFE</text>
    <text x="0" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#titleGrad)">87=L B0@0:0=0</text>
    <text x="2" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#fff8e1" opacity="0.85">!B@>9 3=574> " @01L A>A5459 " K68209</text>
    <text x="2" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#bcaaa4" opacity="0.7">Build " Raid " Survive</text>
  </g>

  <!-- Feature pills -->
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#1a1208" stroke="#ffa726" stroke-width="1.5" opacity="0.9"/>
    <text x="65" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffa726"><× Nest Build</text>

    <rect x="145" y="0" width="110" height="36" rx="18" fill="#1a1208" stroke="#ffa726" stroke-width="1.5" opacity="0.9"/>
    <text x="200" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffa726">” Raids</text>

    <rect x="270" y="0" width="130" height="36" rx="18" fill="#1a1208" stroke="#ffa726" stroke-width="1.5" opacity="0.9"/>
    <text x="335" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffa726">>³ Breeding</text>

    <rect x="415" y="0" width="120" height="36" rx="18" fill="#1a1208" stroke="#ffa726" stroke-width="1.5" opacity="0.9"/>
    <text x="475" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffa726">=_ Arcade</text>
  </g>

  <!-- Accent border -->
  <rect x="4" y="4" width="792" height="462" fill="none" stroke="#ffa726" stroke-width="2" rx="8" opacity="0.25"/>
</svg>
