name: Cockroach Life CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Nightly build — keeps project verified in cloud even if laptop is off
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run build:yandex

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/
          retention-days: 30

  screenshots:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npm run screenshots

      - name: Upload store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: store-assets/screenshots/*.png
          retention-days: 30
