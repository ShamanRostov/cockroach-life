<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a67c1a"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1f0e"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffa726" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a1208" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="64"/>
  <rect width="512" height="512" fill="url(#glow)" rx="64"/>

  <!-- Kitchen floor planks -->
  <g opacity="0.9">
    <rect x="0" y="320" width="512" height="192" fill="url(#floorGrad)"/>
    <line x1="0" y1="360" x2="512" y2="360" stroke="#6d4c12" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="400" x2="512" y2="400" stroke="#6d4c12" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="440" x2="512" y2="440" stroke="#6d4c12" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="480" x2="512" y2="480" stroke="#6d4c12" stroke-width="2" opacity="0.4"/>
    <line x1="128" y1="320" x2="128" y2="512" stroke="#6d4c12" stroke-width="2" opacity="0.3"/>
    <line x1="256" y1="320" x2="256" y2="512" stroke="#6d4c12" stroke-width="2" opacity="0.3"/>
    <line x1="384" y1="320" x2="384" y2="512" stroke="#6d4c12" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Crumb particles -->
  <circle cx="80" cy="420" r="4" fill="#ffca28" opacity="0.7"/>
  <circle cx="420" cy="460" r="3" fill="#ffca28" opacity="0.6"/>
  <circle cx="350" cy="390" r="5" fill="#ffca28" opacity="0.5"/>
  <ellipse cx="180" cy="470" rx="6" ry="3" fill="#ffca28" opacity="0.4"/>

  <!-- Cockroach body -->
  <g filter="url(#shadow)" transform="translate(256, 300)">
    <!-- Shadow on floor -->
    <ellipse cx="0" cy="55" rx="70" ry="18" fill="#000" opacity="0.35"/>

    <!-- Antennae -->
    <path d="M -18 -45 Q -35 -80 -50 -95" stroke="#6d4c3d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 18 -45 Q 35 -80 50 -95" stroke="#6d4c3d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="-50" cy="-95" r="3" fill="#ffa726"/>
    <circle cx="50" cy="-95" r="3" fill="#ffa726"/>

    <!-- Legs -->
    <g stroke="#3e2723" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M -30 10 L -65 35"/>
      <path d="M -20 20 L -58 55"/>
      <path d="M -10 28 L -45 70"/>
      <path d="M 30 10 L 65 35"/>
      <path d="M 20 20 L 58 55"/>
      <path d="M 10 28 L 45 70"/>
    </g>

    <!-- Abdomen -->
    <ellipse cx="0" cy="25" rx="42" ry="32" fill="#4a3728"/>
    <ellipse cx="0" cy="25" rx="38" ry="28" fill="#6d4c3d" opacity="0.5"/>

    <!-- Thorax -->
    <ellipse cx="0" cy="-10" rx="28" ry="22" fill="#4a3728"/>

    <!-- Head -->
    <ellipse cx="0" cy="-38" rx="20" ry="16" fill="#4a3728"/>
    <ellipse cx="0" cy="-38" rx="16" ry="12" fill="#6d4c3d" opacity="0.4"/>

    <!-- Eyes -->
    <circle cx="-8" cy="-42" r="5" fill="#1a1208"/>
    <circle cx="8" cy="-42" r="5" fill="#1a1208"/>
    <circle cx="-7" cy="-43" r="2" fill="#ffa726"/>
    <circle cx="9" cy="-43" r="2" fill="#ffa726"/>

    <!-- Wing case shine -->
    <path d="M -15 5 Q 0 -5 15 5" stroke="#8d6e63" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- Accent ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffa726" stroke-width="3" opacity="0.15"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#e65100" stroke-width="1" opacity="0.1"/>

  <!-- Logo badge -->
  <g transform="translate(256, 100)">
    <rect x="-120" y="-28" width="240" height="56" rx="28" fill="#1a1208" stroke="#ffa726" stroke-width="2" opacity="0.92"/>
    <text x="0" y="8" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffa726">>³ LIFE</text>
  </g>
</svg>
